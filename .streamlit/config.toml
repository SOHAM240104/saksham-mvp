[theme]
primaryColor = "#007AFF"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F5"
textColor = "#1F1F1F"
font = "sans serif"

[server]
headless = true
# Large repos (vector DB, html_store, …) exceed Linux inotify limits on Streamlit Cloud.
fileWatcherType = "none"
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
